name: GH Action Token from Github App
description: Generate Github App token from the Github App

inputs:
  app_id:
    description: Github App ID
    required: true
  app_private_key:
    description: Github App private key
    required: true
  repository_owner:
    description: Repository owner
    required: true

outputs:
  token:
    description: GH Action Token
    value: ${{ steps.generate-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate a Github App Token
      id: generate-token
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.app_private_key }}
        owner: ${{ inputs.repository_owner }}

    - name: Setup GH Cli
      shell: bash
      run: |
        RELEASE=$(cat /etc/os-release | grep ^ID= | sed -e "s/ID=//g")
        if [ "$RELEASE" = '"amzn"' ]; then
          dnf install dnf-plugins-core --assumeyes
          dnf config-manager addrepo --add-repo=https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install gh --repo gh-cli --assumeyes
        elif [ "$RELEASE" = 'fedora' ]; then
          dnf install dnf-plugins-core --assumeyes
          dnf config-manager addrepo --from-repofile=https://cli.github.com/packages/rpm/gh-cli.repo
          dnf install gh --repo gh-cli --assumeyes
        elif [ "$RELEASE" = "ubuntu" ]; then
          sudo mkdir -p -m 755 /etc/apt/keyrings /etc/apt/sources.list.d
          curl --output /tmp/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
          sudo mv /tmp/githubcli-archive-keyring.gpg /etc/apt/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update && sudo apt install gh -y
        elif [ "$RELEASE" = "alpine" ]; then
          apk add --update --no-cache github-cli
        fi
        gh auth setup-git
        gh api octocat
        git config --global user.name "${{ steps.generate-token.outputs.app-slug }}[bot]"
        git config --global user.email "$(gh api '/users/${{ steps.generate-token.outputs.app-slug }}[bot]' --jq .id)+${{ steps.generate-token.outputs.app-slug }}[bot]@users.noreply.github.com"
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
